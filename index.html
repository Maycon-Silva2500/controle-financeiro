<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - AMTech Controle Financeiro</title>
    <style>
        /* ESTILO (CSS) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Cabeçalho com botão de sair */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #2c3e50; }
        .btn-sair { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-sair:hover { background: #c0392b; }

        .dashboard { display: flex; justify-content: space-between; background: #2c3e50; color: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .dashboard div { text-align: center; }
        .dashboard h2 { font-size: 24px; margin-top: 5px; }
        .positive { color: #2ecc71; }
        .negative { color: #e74c3c; }
        
        .form-control { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-control input, .form-control select { padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2980b9; }

        .transaction-list { list-style-type: none; margin-top: 15px; }
        .transaction-list li { background: #f9f9f9; margin-bottom: 10px; padding: 10px; display: flex; justify-content: space-between; border-left: 5px solid #ccc; border-radius: 4px; }
        .transaction-list li.receita { border-left-color: #2ecc71; }
        .transaction-list li.despesa { border-left-color: #e74c3c; }

        .tips-section { margin-top: 25px; padding: 15px; background: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. ESTRUTURA (HTML) -->
        <div class="header">
            <h1>AMTech Painel</h1>
            <button class="btn-sair" id="btn-sair">Sair</button>
        </div>
        
        <div class="dashboard">
            <div>
                <p>Receitas</p>
                <h2 id="total-receitas" class="positive">R$ 0,00</h2>
            </div>
            <div>
                <p>Saldo Atual</p>
                <h2 id="saldo-atual">R$ 0,00</h2>
            </div>
            <div>
                <p>Despesas</p>
                <h2 id="total-despesas" class="negative">R$ 0,00</h2>
            </div>
        </div>

        <form id="form-transacao">
            <div class="form-control">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Salário, Conta de Luz..." required>
            </div>
            <div class="form-control">
                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" placeholder="Ex: 150.00" required>
            </div>
            <div class="form-control">
                <label for="tipo">Tipo</label>
                <select id="tipo">
                    <option value="receita">Receita (Entrada)</option>
                    <option value="despesa">Despesa (Saída)</option>
                </select>
            </div>
            <button type="submit">Adicionar Transação</button>
        </form>

        <div class="tips-section" id="area-dicas">
            <strong>Dica de Investimento:</strong>
            <p id="texto-dica">Carregando dados...</p>
        </div>

        <div>
            <h3 style="margin-top: 20px;">Histórico do Mês</h3>
            <ul class="transaction-list" id="lista-transacoes">
                <!-- As transações do banco aparecerão aqui -->
            </ul>
        </div>
    </div>

    <!-- 2. LÓGICA (JavaScript) - Conectando ao Banco de Dados Firestore -->
    <script type="module">
        // Importando as ferramentas do Firebase (App, Autenticação e Banco de Dados)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // SUAS CHAVES DO FIREBASE AQUI (Cole as mesmas chaves que usou no login.html)
        const firebaseConfig = {
            apiKey: "AIzaSyB67nN2jRUKktgrDWKrfa4eStLwV9-5WEc",
  authDomain: "amtech-controle-financeiro.firebaseapp.com",
  projectId: "amtech-controle-financeiro",
  storageBucket: "amtech-controle-financeiro.firebasestorage.app",
  messagingSenderId: "370711281254",
  appId: "1:370711281254:web:c2db1fe87be145701577a7",
  measurementId: "G-R927NP336V"
        };

        // Inicializando os serviços
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Referência para a coleção (pasta) "transacoes" no banco de dados
        const transacoesRef = collection(db, "transacoes");

        // Capturando elementos do HTML
        const form = document.getElementById('form-transacao');
        const btnSair = document.getElementById('btn-sair');
        const listaTransacoes = document.getElementById('lista-transacoes');
        
        // Variável para guardar quem é o usuário logado no momento
        let usuarioAtual = null;

        // VERIFICAÇÃO DE SEGURANÇA: Observa se o usuário está logado
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Se tiver logado, guarda os dados dele e busca as transações
                usuarioAtual = user;
                carregarTransacoes();
            } else {
                // Se NÃO tiver logado, manda pro login
                window.location.href = "login.html";
            }
        });

        // BOTÃO DE SAIR: Desloga do sistema
        btnSair.addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });

        // FUNÇÃO PARA BUSCAR DADOS: Puxa as transações do usuário logado
        function carregarTransacoes() {
            // Cria uma consulta (query): "Pegue as transações onde o userId é igual ao ID do meu usuário"
            const q = query(transacoesRef, where("userId", "==", usuarioAtual.uid));

            // onSnapshot escuta o banco em tempo real. Se mudar lá, muda aqui na hora.
            onSnapshot(q, (snapshot) => {
                let transacoes = [];
                snapshot.forEach((doc) => {
                    // Guarda os dados e o ID do documento
                    transacoes.push({ id: doc.id, ...doc.data() }); 
                });
                atualizarInterface(transacoes); // Manda desenhar na tela
            });
        }

        // FUNÇÃO DE DESENHAR A TELA (Cálculos de receitas, despesas e saldo)
        function atualizarInterface(transacoes) {
            listaTransacoes.innerHTML = '';
            let totalReceitas = 0;
            let totalDespesas = 0;

            transacoes.forEach((transacao) => {
                const li = document.createElement('li');
                li.classList.add(transacao.tipo);
                li.innerHTML = `${transacao.descricao} <span>R$ ${transacao.valor.toFixed(2)}</span>`;
                listaTransacoes.appendChild(li);

                if (transacao.tipo === 'receita') {
                    totalReceitas += transacao.valor;
                } else {
                    totalDespesas += transacao.valor;
                }
            });

            const saldo = totalReceitas - totalDespesas;

            document.getElementById('total-receitas').innerText = `R$ ${totalReceitas.toFixed(2)}`;
            document.getElementById('total-despesas').innerText = `R$ ${totalDespesas.toFixed(2)}`;
            document.getElementById('saldo-atual').innerText = `R$ ${saldo.toFixed(2)}`;

            gerarDica(saldo, totalReceitas);
        }

        // DICAS DE INVESTIMENTO
        function gerarDica(saldo, receitas) {
            const textoDica = document.getElementById('texto-dica');
            if (receitas === 0) {
                textoDica.innerText = "Adicione suas receitas para receber dicas.";
                return;
            }
            const proporcaoSobra = saldo / receitas;
            if (saldo < 0) {
                textoDica.innerText = "Atenção: Você está gastando mais do que ganha. Tente cortar despesas não essenciais.";
            } else if (proporcaoSobra > 0 && proporcaoSobra <= 0.1) {
                textoDica.innerText = "Que bom que sobrou um pouco! Tente guardar esse valor em um CDB de liquidez diária.";
            } else if (proporcaoSobra > 0.1 && proporcaoSobra <= 0.3) {
                textoDica.innerText = "Ótimo controle! Com essa margem, você já pode investir no Tesouro Selic.";
            } else if (proporcaoSobra > 0.3) {
                textoDica.innerText = "Excelente mês! Considere estudar fundos imobiliários (FIIs) ou ações.";
            } else {
                textoDica.innerText = "Contas empatadas. Reduza 5% dos gastos no próximo mês para começar a investir.";
            }
        }

        // ADICIONAR NOVA TRANSAÇÃO NO BANCO DE DADOS
        form.addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const descricao = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const tipo = document.getElementById('tipo').value;

            // Envia os dados para a nuvem usando addDoc()
            try {
                await addDoc(transacoesRef, {
                    descricao: descricao,
                    valor: valor,
                    tipo: tipo,
                    userId: usuarioAtual.uid // Carimba a transação com o ID do usuário!
                });

                // Limpa o formulário após salvar
                document.getElementById('descricao').value = '';
                document.getElementById('valor').value = '';
            } catch (error) {
                console.error("Erro ao adicionar documento: ", error);
                alert("Erro ao salvar a transação.");
            }
        });
    </script>
</body>
</html>
