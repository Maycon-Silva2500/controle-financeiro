<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMTech Financeiro</title>
    
    <!-- NOVAS LINHAS PARA O ÍCONE DA SUA EMPRESA -->
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- FIM DAS NOVAS LINHAS -->

    <!-- Ícones e Fonte Inter -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Resto do seu código... -->
    <!-- Ícones para os botões -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ESTILO (CSS) - Design original mantido e aprimorado */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #2c3e50; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .login-container {
            background: #fff;
            padding: 40px 30px; /* Um pouco mais de padding superior */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            position: relative;
            text-align: center; /* Centraliza a logo e os textos principais */
        }
        
        /* ESTILO DA LOGO */
        .logo-login {
            max-width: 160px; /* Tamanho ajustável para ficar harmonioso */
            height: auto;
            margin-bottom: 15px;
            display: inline-block;
        }

        h1 {
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .subtitle {
            margin-bottom: 25px;
            color: #002fff;
            font-size: 0.95rem;
        }
        
        /* O formulário volta a alinhar o texto à esquerda */
        form {
            text-align: left;
        }

        .form-control {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .form-control label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.9rem;
        }
        .form-control input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            transition: 0.3s;
            outline: none;
        }
        .form-control input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button:hover { background: #2980b9; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }
        .btn-secondary:hover { background: #bdc3c7; }
        
        .links-area {
            text-align: center;
            margin-top: 15px;
        }
        .link-text {
            color: #3498db;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .link-text:hover { text-decoration: underline; }

        /* Esconder a view de recuperar por padrão */
        #view-recuperar { display: none; }

        /* NOTIFICAÇÕES TOAST */
        #toast-container { position: fixed; top: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 15px; pointer-events: none; }
        .toast { background-color: #fff; min-width: 300px; padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; border-left: 6px solid #3498db;}
        .toast.show { transform: translateX(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- Container das notificações visuais -->
    <div id="toast-container"></div>

    <div class="login-container">
        
        <!-- VISTA 1: LOGIN E REGISTO -->
        <div id="view-login">
            <!-- AQUI ENTRA A LOGO -->
            <img src="logo.png" alt="Logo AMTech" class="logo-login" onerror="this.style.display='none'">
            
            <p class="subtitle"><strong>CONTROLE FINANCEIRO</strong></p>

            <form id="form-login">
                <div class="form-control">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-control">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha " required>
                </div>
                
                <button type="submit" id="btn-entrar"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
                <button type="button" class="btn-secondary" id="btn-cadastrar"><i class="fa-solid fa-user-plus"></i> Criar Conta</button>
            </form>

            <div class="links-area">
                <a class="link-text" id="btn-mostrar-recuperar">Esqueceu a senha?</a>
            </div>
        </div>

        <!-- VISTA 2: RECUPERAR SENHA -->
        <div id="view-recuperar">
            <!-- AQUI ENTRA A LOGO NA TELA DE RECUPERAÇÃO TAMBÉM -->
            <img src="logo.png" alt="Logo AMTech" class="logo-login" onerror="this.style.display='none'">
            
            <h1>Recuperação</h1>
            <p class="subtitle">Digite seu e-mail para receber um link de redefinição de senha.</p>

            <form id="form-recuperar">
                <div class="form-control">
                    <label for="email-recuperar">E-mail Registrado</label>
                    <input type="email" id="email-recuperar" placeholder="seu@email.com" required>
                </div>
                
                <button type="submit" id="btn-enviar-link"><i class="fa-solid fa-paper-plane"></i> Enviar Link</button>
            </form>

            <div class="links-area">
                <a class="link-text" id="btn-voltar-login" style="color: #7f8c8d;"><i class="fa-solid fa-arrow-left"></i> Voltar para o Login</a>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT E FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // SUAS CHAVES DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB67nN2jRUKktgrDWKrfa4eStLwV9-5WEc",
            authDomain: "amtech-controle-financeiro.firebaseapp.com",
            projectId: "amtech-controle-financeiro",
            storageBucket: "amtech-controle-financeiro.firebasestorage.app",
            messagingSenderId: "370711281254",
            appId: "1:370711281254:web:c2db1fe87be145701577a7",
            measurementId: "G-R927NP336V"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Sistema Visual de Notificações
        function mostrarNotificacao(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            let corDestaque = '#2ecc71'; // Verde
            let iconeClass = 'fa-circle-check';
            if (tipo === 'info') { corDestaque = '#3498db'; iconeClass = 'fa-circle-info'; } 
            if (tipo === 'erro') { corDestaque = '#e74c3c'; iconeClass = 'fa-circle-exclamation'; } 
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = corDestaque;
            toast.innerHTML = `<i class="fa-solid ${iconeClass}" style="color: ${corDestaque}; font-size: 24px;"></i><span style="color: #333; font-weight: 500; font-size: 14px;">${mensagem}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => { requestAnimationFrame(() => { toast.classList.add('show'); }); });
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => { toast.remove(); }, 400); }, 3500);
        }

        // Alternância entre as telas de Login e Recuperação
        const viewLogin = document.getElementById('view-login');
        const viewRecuperar = document.getElementById('view-recuperar');
        
        document.getElementById('btn-mostrar-recuperar').addEventListener('click', () => {
            viewLogin.style.display = 'none';
            viewRecuperar.style.display = 'block';
        });

        document.getElementById('btn-voltar-login').addEventListener('click', () => {
            viewRecuperar.style.display = 'none';
            viewLogin.style.display = 'block';
        });

        // ==========================================
        // 1. FAZER LOGIN
        // ==========================================
        document.getElementById('form-login').addEventListener('submit', (e) => {
            e.preventDefault(); 
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-entrar');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
            btn.disabled = true;

            signInWithEmailAndPassword(auth, email, senha)
                .then((userCredential) => {
                    mostrarNotificacao("Acesso autorizado!", "sucesso");
                    setTimeout(() => { window.location.href = "index.html"; }, 1000);
                })
                .catch((error) => {
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
                    btn.disabled = false;
                    
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        mostrarNotificacao("E-mail ou senha incorretos.", "erro");
                    } else {
                        mostrarNotificacao("Erro ao entrar. Tente novamente.", "erro");
                    }
                });
        });

        // ==========================================
        // 2. CRIAR CONTA
        // ==========================================
        document.getElementById('btn-cadastrar').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-cadastrar');

            if(!email) { mostrarNotificacao("Digite um e-mail para cadastrar.", "erro"); return; }
            if(senha.length < 6) { mostrarNotificacao("A senha deve ter pelo menos 6 caracteres.", "erro"); return; }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando...';
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, email, senha)
                .then((userCredential) => {
                    mostrarNotificacao("Conta criada com sucesso! Bem-vindo.", "sucesso");
                    setTimeout(() => { window.location.href = "index.html"; }, 1500);
                })
                .catch((error) => {
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Criar Conta';
                    btn.disabled = false;
                    
                    if (error.code === 'auth/email-already-in-use') {
                        mostrarNotificacao("Este e-mail já possui uma conta.", "erro");
                    } else {
                        mostrarNotificacao("Erro ao criar conta.", "erro");
                    }
                });
        });

        // ==========================================
        // 3. RECUPERAR SENHA
        // ==========================================
        document.getElementById('form-recuperar').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email-recuperar').value;
            const btn = document.getElementById('btn-enviar-link');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
            btn.disabled = true;

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    mostrarNotificacao("Link enviado! Verifique sua caixa de e-mail.", "sucesso");
                    setTimeout(() => {
                        document.getElementById('email-recuperar').value = '';
                        document.getElementById('btn-voltar-login').click();
                        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Link';
                        btn.disabled = false;
                    }, 3000);
                })
                .catch((error) => {
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Link';
                    btn.disabled = false;
                    
                    if (error.code === 'auth/invalid-email') {
                        mostrarNotificacao("Formato de e-mail inválido.", "erro");
                    } else {
                        mostrarNotificacao("Erro ao enviar o link de recuperação.", "erro");
                    }
                });
        });
    </script>
</body>
</html>
