<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Acesse seu controle financeiro AMTech.">
    <meta name="color-scheme" content="dark light">
    <title>Entrar | AMTech Financeiro</title>

    <link rel="icon" href="assets/images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <meta name="theme-color" content="#08090A">

    <!-- Aplica o tema salvo antes da primeira pintura -->
    <script>try { var t = localStorage.getItem('amtech-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>

    <link rel="stylesheet" href="design-system/tokens.css?v=3">
    <link rel="stylesheet" href="design-system/components.css?v=3">
    <link rel="stylesheet" href="assets/css/login.css?v=5">
</head>
<body>

    <button type="button" class="icon-btn tema-flutuante" id="btn-theme" title="Alternar entre tema claro e escuro" aria-label="Alternar entre tema claro e escuro">
        <svg class="icon" aria-hidden="true"><use id="icone-tema" href="assets/icons/sprite.svg#i-moon"/></svg>
    </button>

    <!-- Container das notificações visuais -->
    <div id="toast-container" aria-live="polite"></div>

    <main class="login-container">

        <!-- Vista 1: login e registro -->
        <div id="view-login">
            <img src="assets/images/logo.png" alt="Logo AMTech" class="logo-login" onerror="this.style.display='none'">

            <p class="subtitle label-lg">Controle financeiro</p>

            <form id="form-login" novalidate>
                <div class="form-control">
                    <label for="email">E-mail</label>
                    <div class="input-icon">
                        <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-mail"/></svg>
                        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" inputmode="email" required aria-describedby="email-erro">
                    </div>
                    <p class="field-error" id="email-erro" role="alert" hidden></p>
                </div>
                <div class="form-control">
                    <label for="senha">Senha</label>
                    <div class="input-icon has-action">
                        <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-lock"/></svg>
                        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required aria-describedby="senha-ajuda senha-erro">
                        <button type="button" class="toggle-senha" data-alvo="senha" aria-label="Mostrar senha" aria-pressed="false">
                            <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-eye"/></svg>
                        </button>
                    </div>
                    <p class="field-hint" id="senha-ajuda">Mínimo de 6 caracteres para criar uma conta.</p>
                    <p class="field-error" id="senha-erro" role="alert" hidden></p>
                </div>

                <button type="submit" class="cf-btn cf-btn-primary" id="btn-entrar"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-log-in"/></svg> Entrar</button>
                <button type="button" class="cf-btn cf-btn-secondary" id="btn-cadastrar"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-user-plus"/></svg> Criar conta</button>
            </form>

            <div class="links-area">
                <button type="button" class="link-text" id="btn-mostrar-recuperar">Esqueceu a senha?</button>
            </div>
        </div>

        <!-- Vista 2: recuperar senha -->
        <div id="view-recuperar">
            <img src="assets/images/logo.png" alt="Logo AMTech" class="logo-login" onerror="this.style.display='none'">

            <h1>Recuperar senha</h1>
            <p class="subtitle">Digite seu e-mail para receber um link de redefinição de senha.</p>

            <form id="form-recuperar" novalidate>
                <div class="form-control">
                    <label for="email-recuperar">E-mail cadastrado</label>
                    <div class="input-icon">
                        <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-mail"/></svg>
                        <input type="email" id="email-recuperar" placeholder="seu@email.com" autocomplete="email" inputmode="email" required aria-describedby="email-recuperar-erro">
                    </div>
                    <p class="field-error" id="email-recuperar-erro" role="alert" hidden></p>
                </div>

                <button type="submit" class="cf-btn cf-btn-primary" id="btn-enviar-link"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-mail"/></svg> Enviar link</button>
            </form>

            <div class="links-area">
                <button type="button" class="link-text link-muted" id="btn-voltar-login"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-arrow-left"/></svg> Voltar para o login</button>
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT E FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // SUAS CHAVES DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB67nN2jRUKktgrDWKrfa4eStLwV9-5WEc",
            authDomain: "amtech-controle-financeiro.firebaseapp.com",
            projectId: "amtech-controle-financeiro",
            storageBucket: "amtech-controle-financeiro.firebasestorage.app",
            messagingSenderId: "370711281254",
            appId: "1:370711281254:web:c2db1fe87be145701577a7",
            measurementId: "G-R927NP336V"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const $ = (id) => document.getElementById(id);
        const SPRITE = 'assets/icons/sprite.svg';
        const SVG_NS = 'http://www.w3.org/2000/svg';

        // ---------- Tema (claro, escuro ou automático) ----------
        const raiz = document.documentElement;
        const consultaClaro = window.matchMedia('(prefers-color-scheme: light)');
        const lerTema = () => { try { return localStorage.getItem('amtech-theme'); } catch (e) { return null; } };
        function temaEscuro() {
            const salvo = lerTema();
            return salvo === 'light' || salvo === 'dark' ? salvo === 'dark' : !consultaClaro.matches;
        }
        function atualizarTema() {
            $('icone-tema').setAttribute('href', `${SPRITE}#i-${temaEscuro() ? 'sun' : 'moon'}`);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', getComputedStyle(raiz).getPropertyValue('--surface-100').trim());
        }
        $('btn-theme').addEventListener('click', () => {
            const proximo = temaEscuro() ? 'light' : 'dark';
            raiz.setAttribute('data-theme', proximo);
            try { localStorage.setItem('amtech-theme', proximo); } catch (e) { /* sem persistência */ }
            atualizarTema();
        });
        consultaClaro.addEventListener('change', atualizarTema);
        atualizarTema();

        // ---------- Elementos e notificações ----------
        function iconeSvg(nome, cor) {
            const svg = document.createElementNS(SVG_NS, 'svg');
            svg.setAttribute('class', 'icon');
            svg.setAttribute('aria-hidden', 'true');
            if (cor) svg.style.color = cor;
            const uso = document.createElementNS(SVG_NS, 'use');
            uso.setAttribute('href', `${SPRITE}#i-${nome}`);
            svg.appendChild(uso);
            return svg;
        }
        const ICONES = { entrar: 'log-in', criar: 'user-plus', enviar: 'mail' };
        function definirBotao(btn, icone, texto) {
            btn.replaceChildren(iconeSvg(icone), document.createTextNode(' ' + texto));
        }

        function mostrarNotificacao(mensagem, tipo = 'sucesso') {
            const container = $('toast-container');
            const estilos = {
                sucesso: { cor: 'var(--success)', icone: 'circle-check' },
                info: { cor: 'var(--category-blue)', icone: 'info' },
                erro: { cor: 'var(--danger)', icone: 'circle-alert' }
            };
            const { cor, icone } = estilos[tipo] || estilos.sucesso;

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
            const texto = document.createElement('span');
            texto.textContent = mensagem;
            toast.append(iconeSvg(icone, cor), texto);

            container.appendChild(toast);
            requestAnimationFrame(() => { requestAnimationFrame(() => { toast.classList.add('show'); }); });
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => { toast.remove(); }, 400); }, 3500);
        }

        // ---------- Validação em linha ----------
        const EMAIL_VALIDO = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        function mostrarErro(input, mensagem) {
            const erro = $(`${input.id}-erro`);
            input.setAttribute('aria-invalid', 'true');
            input.closest('.input-icon').classList.add('is-invalid');
            erro.textContent = mensagem;
            erro.hidden = false;
        }
        function limparErro(input) {
            const erro = $(`${input.id}-erro`);
            input.removeAttribute('aria-invalid');
            input.closest('.input-icon').classList.remove('is-invalid');
            erro.textContent = '';
            erro.hidden = true;
        }
        document.addEventListener('input', (e) => { if (e.target.matches('[aria-invalid="true"]')) limparErro(e.target); });
        function validarEmail(input) {
            const valor = input.value.trim();
            if (!valor) { mostrarErro(input, 'Informe o seu e-mail.'); return false; }
            if (!EMAIL_VALIDO.test(valor)) { mostrarErro(input, 'Esse e-mail parece incompleto. Exemplo: nome@empresa.com'); return false; }
            return true;
        }

        // Mostrar ou ocultar a senha
        document.querySelector('.toggle-senha').addEventListener('click', (e) => {
            const botao = e.currentTarget;
            const campo = $(botao.dataset.alvo);
            const mostrar = campo.type === 'password';
            campo.type = mostrar ? 'text' : 'password';
            botao.setAttribute('aria-pressed', String(mostrar));
            botao.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
            botao.querySelector('use').setAttribute('href', `${SPRITE}#i-${mostrar ? 'eye-off' : 'eye'}`);
        });

        // Alternância entre as telas de Login e Recuperação
        const viewLogin = $('view-login');
        const viewRecuperar = $('view-recuperar');

        $('btn-mostrar-recuperar').addEventListener('click', () => {
            $('email-recuperar').value = $('email').value.trim();
            viewLogin.style.display = 'none';
            viewRecuperar.style.display = 'block';
            $('email-recuperar').focus();
        });

        $('btn-voltar-login').addEventListener('click', () => {
            viewRecuperar.style.display = 'none';
            viewLogin.style.display = 'block';
            $('email').focus();
        });

        // ==========================================
        // 1. FAZER LOGIN
        // ==========================================
        $('form-login').addEventListener('submit', (e) => {
            e.preventDefault();
            const campoEmail = $('email');
            const campoSenha = $('senha');
            [campoEmail, campoSenha].forEach(limparErro);

            const emailOk = validarEmail(campoEmail);
            const senhaOk = !!campoSenha.value;
            if (!senhaOk) mostrarErro(campoSenha, 'Informe a sua senha.');
            if (!emailOk) { campoEmail.focus(); return; }
            if (!senhaOk) { campoSenha.focus(); return; }

            const btn = $('btn-entrar');
            definirBotao(btn, 'loader-circle', 'Entrando…');
            btn.disabled = true;

            signInWithEmailAndPassword(auth, campoEmail.value.trim(), campoSenha.value)
                .then(() => {
                    mostrarNotificacao("Acesso autorizado.", "sucesso");
                    setTimeout(() => { window.location.href = "index.html"; }, 1000);
                })
                .catch((error) => {
                    definirBotao(btn, ICONES.entrar, 'Entrar');
                    btn.disabled = false;

                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        mostrarErro(campoSenha, 'E-mail ou senha incorretos.');
                        campoSenha.focus();
                    } else if (error.code === 'auth/too-many-requests') {
                        mostrarNotificacao("Muitas tentativas. Aguarde alguns minutos e tente de novo.", "erro");
                    } else if (error.code === 'auth/network-request-failed') {
                        mostrarNotificacao("Sem conexão. Verifique a internet e tente de novo.", "erro");
                    } else {
                        mostrarNotificacao("Erro ao entrar. Tente novamente.", "erro");
                    }
                });
        });

        // ==========================================
        // 2. CRIAR CONTA
        // ==========================================
        $('btn-cadastrar').addEventListener('click', () => {
            const campoEmail = $('email');
            const campoSenha = $('senha');
            [campoEmail, campoSenha].forEach(limparErro);

            const emailOk = validarEmail(campoEmail);
            const senhaOk = campoSenha.value.length >= 6;
            if (!senhaOk) mostrarErro(campoSenha, 'A senha deve ter pelo menos 6 caracteres.');
            if (!emailOk) { campoEmail.focus(); return; }
            if (!senhaOk) { campoSenha.focus(); return; }

            const btn = $('btn-cadastrar');
            definirBotao(btn, 'loader-circle', 'Criando…');
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, campoEmail.value.trim(), campoSenha.value)
                .then(() => {
                    mostrarNotificacao("Conta criada com sucesso.", "sucesso");
                    setTimeout(() => { window.location.href = "index.html"; }, 1500);
                })
                .catch((error) => {
                    definirBotao(btn, ICONES.criar, 'Criar conta');
                    btn.disabled = false;

                    if (error.code === 'auth/email-already-in-use') {
                        mostrarErro(campoEmail, 'Este e-mail já possui uma conta. Use "Entrar".');
                        campoEmail.focus();
                    } else if (error.code === 'auth/weak-password') {
                        mostrarErro(campoSenha, 'A senha é muito fraca. Use pelo menos 6 caracteres.');
                        campoSenha.focus();
                    } else {
                        mostrarNotificacao("Erro ao criar conta.", "erro");
                    }
                });
        });

        // ==========================================
        // 3. RECUPERAR SENHA
        // ==========================================
        $('form-recuperar').addEventListener('submit', (e) => {
            e.preventDefault();
            const campo = $('email-recuperar');
            limparErro(campo);
            if (!validarEmail(campo)) { campo.focus(); return; }

            const btn = $('btn-enviar-link');
            definirBotao(btn, 'loader-circle', 'Enviando…');
            btn.disabled = true;

            sendPasswordResetEmail(auth, campo.value.trim())
                .then(() => {
                    mostrarNotificacao("Link enviado. Verifique sua caixa de e-mail.", "sucesso");
                    setTimeout(() => {
                        campo.value = '';
                        $('btn-voltar-login').click();
                        definirBotao(btn, ICONES.enviar, 'Enviar link');
                        btn.disabled = false;
                    }, 3000);
                })
                .catch((error) => {
                    definirBotao(btn, ICONES.enviar, 'Enviar link');
                    btn.disabled = false;

                    if (error.code === 'auth/invalid-email') {
                        mostrarErro(campo, 'Formato de e-mail inválido.');
                    } else {
                        mostrarNotificacao("Erro ao enviar o link de recuperação.", "erro");
                    }
                });
        });
    </script>
</body>
</html>
